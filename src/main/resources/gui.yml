config-version: 36

general:
  enabled: true
  # GUI content is created only when opened. No tick-based refresh is used.
  live-refresh:
    enabled: false

common:
  filler:
    enabled: true
    material: "BLACK_STAINED_GLASS_PANE"
    display-name: " "
  frame:
    enabled: true
    material: "PURPLE_STAINED_GLASS_PANE"
    display-name: " "
    top-row: true
    bottom-row: true

main-menu:
  title: "<dark_gray>Clan <gold>Menu"
  size: 54

  profile:
    slot: 13
    material: "PLAYER_HEAD"
    display-name: "<gradient:#FFB347:#FFD166>{clan}</gradient>"
    lore:
      - "<gray>Tag: <white>{formatted_tag}"
      - "<gray>Members: <white>{members}/{max_members}"

  members:
    slot: 20
    material: "PLAYER_HEAD"
    display-name: "<gold>Members"

  join-mode:
    slot: 24
    material: "COMPARATOR"
    display-name: "<gold>Join mode"
